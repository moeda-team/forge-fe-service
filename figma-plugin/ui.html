<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; font: 12px Inter, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
      h1 { margin: 0 0 6px; font-size: 15px; }
      p { min-height: 34px; margin: 0 0 14px; color: var(--figma-color-text-secondary); line-height: 1.45; }
      .actions { display: flex; gap: 8px; }
      button { height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--figma-color-border); color: var(--figma-color-text); background: var(--figma-color-bg); cursor: pointer; }
      button.primary { flex: 1; border-color: #0d99ff; color: white; background: #0d99ff; font-weight: 600; }
      button:disabled { opacity: .45; cursor: default; }
      textarea { position: fixed; left: -9999px; width: 1px; height: 1px; }
    </style>
  </head>
  <body>
    <h1>Forge Copy</h1>
    <p id="status">Pilih layer di Figma untuk menyiapkan copy editable.</p>
    <div class="actions">
      <button id="refresh" type="button">Refresh</button>
      <button id="copy" class="primary" type="button" disabled>Copy to Forge</button>
    </div>
    <textarea id="payload" aria-hidden="true"></textarea>
    <script>
      const status = document.getElementById("status");
      const copy = document.getElementById("copy");
      const payload = document.getElementById("payload");

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (message.type === "ready") {
          payload.value = message.text;
          copy.disabled = false;
          status.textContent = `${message.count} layer siap. Copy, lalu paste di canvas Forge.`;
        } else if (message.type === "empty") {
          payload.value = "";
          copy.disabled = true;
          status.textContent = "Pilih minimal satu layer di Figma.";
        } else if (message.type === "error") {
          copy.disabled = true;
          status.textContent = message.message;
        }
      };

      document.getElementById("refresh").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "refresh" } }, "*");
      };

      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(payload.value);
        } catch {
          payload.focus();
          payload.select();
          document.execCommand("copy");
        }
        status.textContent = "Copied! Sekarang Cmd/Ctrl+V di canvas Forge.";
      };
    </script>
  </body>
</html>
